name: Build Phenomenon
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle build --stacktrace
      - name: Verify packaged mixin refmap
        run: python3 scripts/verify_mod_jar.py
      - uses: actions/upload-artifact@v4
        with:
          name: phenomenon-fabric-1.21.2
          path: build/libs/*.jar
